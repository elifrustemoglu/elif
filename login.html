<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Eğitim ve Etkinlik Portalı</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

    <!-- Ana Giriş Kutusu (Div Container) -->
    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md border border-gray-100">
        
        <!-- Başlık Kısmı -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-600 mb-2">Hoş Geldiniz</h1>
            <p class="text-gray-500 text-sm">Eğitim ve Etkinlik Portalına giriş yapın</p>
        </div>

        <!-- Giriş Formu -->
        <form action="#" method="POST" class="space-y-6">
            
            <!-- E-posta Alanı -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">E-posta Adresi</label>
                <input type="email" required 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" 
                    placeholder="ornek@email.com">
            </div>

            <!-- Şifre Alanı -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Şifre</label>
                <input type="password" required 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" 
                    placeholder="••••••••">
            </div>

            <!-- Beni Hatirla ve Şifremi Unuttum -->
            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center text-gray-600">
                    <input type="checkbox" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500 mr-2">
                    Beni Hatırla
                </label>
                <a href="#" class="text-blue-600 hover:underline">Şifremi Unuttum</a>
            </div>

            <!-- Giriş Yap Butonu -->
            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md">
                Giriş Yap
            </button>
        </form>

        <!-- Alt Bilgi / Ana Sayfaya Dönüş -->
        <div class="mt-6 text-center">
            <a href="index.html" class="text-sm text-gray-500 hover:text-blue-600 transition">
                ← Ana Sayfaya Geri Dön
            </a>
        </div>

    </div>

</body>
</html>
