<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Eğitim ve Etkinlik Portalı</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
    <nav class="w-full border-b border-slate-200/80 bg-white px-4 py-4 shadow-sm sm:px-6">
        <div class="mx-auto flex max-w-7xl items-center justify-between gap-4">
            <a href="index.html" class="flex min-w-0 items-center gap-3">
                <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-pink-500 to-purple-600 text-xl font-bold text-white shadow-md shadow-pink-500/20">
                    <i class="fa-solid fa-graduation-cap" aria-hidden="true"></i>
                </span>
                <span class="flex min-w-0 flex-col">
                    <span class="text-sm font-bold leading-tight tracking-wide text-slate-900 sm:text-lg">EĞİTİM VE ETKİNLİK DUYURU PORTALI</span>
                    <span class="mt-1 text-[10px] uppercase tracking-widest text-slate-500">Etkinlik & Kulüpler</span>
                </span>
            </a>
            <a href="index.html" class="flex shrink-0 items-center gap-2 rounded-full bg-gradient-to-r from-pink-600 via-purple-600 to-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-lg shadow-purple-600/25 transition-all hover:from-pink-500 hover:to-indigo-500 hover:shadow-purple-600/40 sm:px-6">
                <i class="fa-solid fa-arrow-left text-xs" aria-hidden="true"></i>
                <span>Ana Sayfa</span>
            </a>
        </div>
    </nav>

    <main class="flex min-h-[calc(100vh-73px)] items-center justify-center px-4 py-10 sm:px-6">
        <section class="w-full max-w-md rounded-2xl border border-slate-100 bg-white p-6 shadow-xl shadow-slate-200/60 sm:p-8">
            <div class="mb-8 text-center">
                <span class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-pink-500 to-purple-600 text-2xl text-white shadow-lg shadow-purple-500/25">
                    <i class="fa-solid fa-user" aria-hidden="true"></i>
                </span>
                <h1 class="mb-2 text-3xl font-bold text-slate-900">Hoş Geldiniz</h1>
                <p class="text-sm text-slate-500">Eğitim ve Etkinlik Portalına giriş yapın</p>
            </div>

            <form action="#" method="POST" class="space-y-5">
                <div>
                    <label for="email" class="mb-1.5 block text-sm font-medium text-slate-700">E-posta Adresi</label>
                    <input id="email" name="email" type="email" autocomplete="email" required
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 transition focus:border-purple-500 focus:outline-none focus:ring-2 focus:ring-purple-500/20"
                        placeholder="ornek@email.com">
                </div>

                <div>
                    <label for="password" class="mb-1.5 block text-sm font-medium text-slate-700">Şifre</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 transition focus:border-purple-500 focus:outline-none focus:ring-2 focus:ring-purple-500/20"
                        placeholder="Şifrenizi girin">
                </div>

                <div class="flex items-center justify-between gap-3 text-sm">
                    <label class="flex items-center text-slate-600">
                        <input type="checkbox" name="remember" class="mr-2 rounded border-slate-300 text-purple-600 focus:ring-purple-500">
                        Beni Hatırla
                    </label>
                    <a href="#" class="text-purple-600 transition hover:text-pink-600 hover:underline">Şifremi Unuttum</a>
                </div>

                <button type="submit" class="flex w-full items-center justify-center gap-2 rounded-full bg-gradient-to-r from-pink-600 via-purple-600 to-indigo-600 py-3 font-semibold text-white shadow-lg shadow-purple-600/25 transition-all hover:from-pink-500 hover:to-indigo-500 hover:shadow-purple-600/40">
                    Giriş Yap
                    <i class="fa-solid fa-arrow-right text-xs" aria-hidden="true"></i>
                </button>
            </form>

            <p class="mt-6 text-center text-sm text-slate-500">
                <a href="index.html" class="transition hover:text-purple-600">← Ana Sayfaya Geri Dön</a>
            </p>
        </section>
    </main>
</body>
</html>
