<!DOCTYPE html>
<html lang="tr">
<head>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/flexbox.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim - EĞİTİM VE ETKİNLİK PORTALI</title>
</head>
<body>

    <header>
        <h1>EĞİTİM VE ETKİNLİK DUYURU PORTALI</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a> | 
            <a href="events.html">Etkinlikler</a> | 
            <a href="contact.html" class="btn">İletişime Geç</a>
        </nav>
    </header>

    <main>
        <h2>İletişim Formu</h2>
        <p>Bize ulaşmak için aşağıdaki formu doldurabilirsiniz.</p>
        
        <form class="my-form">
            <label for="fullname">Ad Soyad:</label>
            <input type="text" id="fullname" placeholder="Adınız ve Soyadınız">

            <label for="email">E-posta Adresi:</label>
            <input type="email" id="email" placeholder="ornek@email.com">

            <label for="category">Kategori:</label>
            <select id="category">
                <option>Bilgi Talebi</option>
                <option>Geri Bildirim</option>
            </select>

            <label for="message">Mesajınız:</label>
            <textarea id="message" placeholder="Mesajınızı buraya yazın..."></textarea>

            <button type="submit" class="btn">Gönder</button>
        </form>
    </main>

</body>
</html>
